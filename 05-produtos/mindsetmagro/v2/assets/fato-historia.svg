<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="fato-historia-title"><title id="fato-historia-title">Separar para enxergar</title><rect width="900" height="620" fill="#faf8f2"/><text x="42" y="55" font-family="sans-serif" font-size="26" fill="#24483f">Separar para enxergar</text><rect x="50" y="130" width="800" height="110" rx="14" fill="white" stroke="#78958b"/><text x="68" y="164" font-family="sans-serif" font-size="22" fill="#24483f">Fato</text><text x="68" y="195" font-family="sans-serif" font-size="19" fill="#455b54">O que uma observação ou registro sustenta?</text><rect x="50" y="270" width="800" height="110" rx="14" fill="white" stroke="#78958b"/><text x="68" y="304" font-family="sans-serif" font-size="22" fill="#24483f">Narrativa</text><text x="68" y="335" font-family="sans-serif" font-size="19" fill="#455b54">Que interpretação acrescentei ao acontecimento?</text><rect x="50" y="410" width="800" height="110" rx="14" fill="white" stroke="#78958b"/><text x="68" y="444" font-family="sans-serif" font-size="22" fill="#24483f">Incógnita</text><text x="68" y="475" font-family="sans-serif" font-size="19" fill="#455b54">O que ainda preciso perguntar, testar ou não sei?</text></svg>