<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="habito-contexto-title"><title id="habito-contexto-title">O comportamento acontece em um contexto</title><rect width="900" height="620" fill="#faf8f2"/><text x="42" y="55" font-family="sans-serif" font-size="26" fill="#24483f">O comportamento acontece em um contexto</text><rect x="40" y="100" width="395" height="110" rx="14" fill="white" stroke="#78958b"/><text x="58" y="134" font-family="sans-serif" font-size="22" fill="#24483f">Contexto e oportunidade</text><text x="58" y="165" font-family="sans-serif" font-size="19" fill="#455b54">Tempo, recursos, ambiente e outras</text><text x="58" y="188" font-family="sans-serif" font-size="19" fill="#455b54">pessoas.</text><rect x="465" y="100" width="395" height="110" rx="14" fill="white" stroke="#78958b"/><text x="483" y="134" font-family="sans-serif" font-size="22" fill="#24483f">Capacidade e motivação</text><text x="483" y="165" font-family="sans-serif" font-size="19" fill="#455b54">Habilidades, energia, prioridades e</text><text x="483" y="188" font-family="sans-serif" font-size="19" fill="#455b54">emoções.</text><rect x="245" y="270" width="410" height="110" rx="14" fill="white" stroke="#78958b"/><text x="263" y="304" font-family="sans-serif" font-size="22" fill="#24483f">Ação possível</text><text x="263" y="335" font-family="sans-serif" font-size="19" fill="#455b54">Escolher uma resposta pequena e</text><text x="263" y="358" font-family="sans-serif" font-size="19" fill="#455b54">específica.</text><rect x="245" y="445" width="410" height="110" rx="14" fill="white" stroke="#78958b"/><text x="263" y="479" font-family="sans-serif" font-size="22" fill="#24483f">Consequência e revisão</text><text x="263" y="510" font-family="sans-serif" font-size="19" fill="#455b54">Observar; repetir, adaptar ou</text><text x="263" y="533" font-family="sans-serif" font-size="19" fill="#455b54">interromper.</text><path d="M245 210L350 270M660 210L550 270M450 380V445M245 500Q80 400 150 210" fill="none" stroke="#78958b" stroke-width="3"/></svg>