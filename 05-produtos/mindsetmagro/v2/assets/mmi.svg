<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="mmi-title"><title id="mmi-title">MMI 2.0 · como quero viver neste corpo?</title><rect width="900" height="620" fill="#faf8f2"/><text x="42" y="55" font-family="sans-serif" font-size="26" fill="#24483f">MMI 2.0 · como quero viver neste corpo?</text><rect x="40" y="100" width="398" height="125" rx="14" fill="white" stroke="#78958b"/><text x="58" y="134" font-family="sans-serif" font-size="22" fill="#24483f">Conforto e mobilidade</text><text x="58" y="165" font-family="sans-serif" font-size="19" fill="#455b54">Vestir, sentar, caminhar, alcançar.</text><rect x="460" y="100" width="398" height="125" rx="14" fill="white" stroke="#78958b"/><text x="478" y="134" font-family="sans-serif" font-size="22" fill="#24483f">Força e energia</text><text x="478" y="165" font-family="sans-serif" font-size="19" fill="#455b54">O que quero conseguir fazer?</text><rect x="40" y="250" width="398" height="125" rx="14" fill="white" stroke="#78958b"/><text x="58" y="284" font-family="sans-serif" font-size="22" fill="#24483f">Sono e cuidado</text><text x="58" y="315" font-family="sans-serif" font-size="19" fill="#455b54">Que rotina me ampara?</text><rect x="460" y="250" width="398" height="125" rx="14" fill="white" stroke="#78958b"/><text x="478" y="284" font-family="sans-serif" font-size="22" fill="#24483f">Relação comigo</text><text x="478" y="315" font-family="sans-serif" font-size="19" fill="#455b54">Que linguagem quero abandonar?</text><rect x="40" y="400" width="398" height="125" rx="14" fill="white" stroke="#78958b"/><text x="58" y="434" font-family="sans-serif" font-size="22" fill="#24483f">Aparência: opcional</text><text x="58" y="465" font-family="sans-serif" font-size="19" fill="#455b54">Desejo estético não mede dignidade.</text><rect x="460" y="400" width="398" height="125" rx="14" fill="white" stroke="#78958b"/><text x="478" y="434" font-family="sans-serif" font-size="22" fill="#24483f">Manutenção</text><text x="478" y="465" font-family="sans-serif" font-size="19" fill="#455b54">Qual cuidado cabe na vida real?</text></svg>