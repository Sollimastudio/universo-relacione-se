<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="processo-title"><title id="processo-title">Imaginar, contrastar e agir</title><rect width="900" height="620" fill="#faf8f2"/><text x="42" y="55" font-family="sans-serif" font-size="26" fill="#24483f">Imaginar, contrastar e agir</text><rect x="50" y="110" width="800" height="110" rx="14" fill="white" stroke="#78958b"/><text x="68" y="144" font-family="sans-serif" font-size="22" fill="#24483f">Veja o processo</text><text x="68" y="175" font-family="sans-serif" font-size="19" fill="#455b54">Imagine onde, quando e como fará uma ação concreta.</text><rect x="50" y="270" width="800" height="110" rx="14" fill="white" stroke="#78958b"/><text x="68" y="304" font-family="sans-serif" font-size="22" fill="#24483f">Reconheça o obstáculo</text><text x="68" y="335" font-family="sans-serif" font-size="19" fill="#455b54">Qual barreira provável merece um plano?</text><rect x="50" y="430" width="800" height="110" rx="14" fill="white" stroke="#78958b"/><text x="68" y="464" font-family="sans-serif" font-size="22" fill="#24483f">Se acontecer X, então farei Y</text><text x="68" y="495" font-family="sans-serif" font-size="19" fill="#455b54">Teste a resposta; observe o resultado; revise.</text></svg>