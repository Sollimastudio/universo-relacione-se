<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="acucar-honesto-title"><title id="acucar-honesto-title">Tradução visual · exemplo hipotético</title><rect width="900" height="620" fill="#faf8f2"/><text x="42" y="55" font-family="sans-serif" font-size="26" fill="#24483f">Tradução visual · exemplo hipotético</text><rect x="50" y="110" width="800" height="110" rx="14" fill="white" stroke="#78958b"/><text x="68" y="144" font-family="sans-serif" font-size="22" fill="#24483f">Rótulo fictício: 10 g de açúcar / 100 ml</text><text x="68" y="175" font-family="sans-serif" font-size="19" fill="#455b54">Porção consumida: 200 ml. Não representa uma marca real.</text><rect x="50" y="270" width="800" height="110" rx="14" fill="white" stroke="#78958b"/><text x="68" y="304" font-family="sans-serif" font-size="22" fill="#24483f">10 × (200 ÷ 100) = 20 g</text><text x="68" y="335" font-family="sans-serif" font-size="19" fill="#455b54">Massa de açúcar: 20 g. Não é um copo cheio de açúcar.</text><rect x="50" y="430" width="800" height="110" rx="14" fill="white" stroke="#78958b"/><text x="68" y="464" font-family="sans-serif" font-size="22" fill="#24483f">Antes de comparar, leia o rótulo real</text><text x="68" y="495" font-family="sans-serif" font-size="19" fill="#455b54">Açúcares totais e adicionados são informações distintas.</text></svg>