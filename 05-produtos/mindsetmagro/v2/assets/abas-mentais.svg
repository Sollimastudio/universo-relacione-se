<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="abas-mentais-title"><title id="abas-mentais-title">Nem toda aba precisa ficar aberta</title><rect width="900" height="620" fill="#faf8f2"/><text x="42" y="55" font-family="sans-serif" font-size="26" fill="#24483f">Nem toda aba precisa ficar aberta</text><rect x="50" y="110" width="800" height="110" rx="14" fill="white" stroke="#78958b"/><text x="68" y="144" font-family="sans-serif" font-size="22" fill="#24483f">Capture sem resolver tudo</text><text x="68" y="175" font-family="sans-serif" font-size="19" fill="#455b54">Escreva uma frase por pendência.</text><rect x="50" y="270" width="390" height="145" rx="14" fill="white" stroke="#78958b"/><text x="68" y="304" font-family="sans-serif" font-size="22" fill="#24483f">Tem uma ação possível?</text><text x="68" y="335" font-family="sans-serif" font-size="19" fill="#455b54">Escolha o menor próximo passo.</text><rect x="465" y="270" width="385" height="145" rx="14" fill="white" stroke="#78958b"/><text x="483" y="304" font-family="sans-serif" font-size="22" fill="#24483f">Não depende de você?</text><text x="483" y="335" font-family="sans-serif" font-size="19" fill="#455b54">Nomeie o limite do seu alcance.</text><rect x="50" y="460" width="800" height="105" rx="14" fill="white" stroke="#78958b"/><text x="68" y="494" font-family="sans-serif" font-size="22" fill="#24483f">Uma prioridade volta à mesa</text><text x="68" y="525" font-family="sans-serif" font-size="19" fill="#455b54">O restante fica registrado, não comandando o momento.</text></svg>